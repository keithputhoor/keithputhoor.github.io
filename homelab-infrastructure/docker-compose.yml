version: '3.8'

services:
  # Docker Socket Proxy - Securely exposes Docker daemon to Traefik
  socket-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: socket-proxy
    environment:
      - CONTAINERS=1 # Allow Traefik to read container metadata
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # Read-only mounting
    networks:
      - socket_net
    restart: unless-stopped

  # Traefik Reverse Proxy
  traefik:
    image: traefik:v2.10
    container_name: traefik
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=tcp://socket-proxy:2375" # Connect via proxy
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
    networks:
      - socket_net
      - proxy_net
    depends_on:
      - socket-proxy
    restart: unless-stopped

  # Cloudflare Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - proxy_net # Needs access to Traefik
    restart: unless-stopped

networks:
  socket_net:
    internal: true # No external access to the Docker socket proxy
  proxy_net:
    external: false
